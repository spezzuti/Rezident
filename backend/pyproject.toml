[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS — self-hosted web dashboard that operates a Claude Code agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk>=0.1.80",
    "aiosqlite>=0.20",
    "croniter>=3.0",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentos*"]
