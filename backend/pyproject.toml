[project]
# Distribution is named for the product; the importable package keeps its
# original `agentos` name so existing installs, env vars, and data upgrade cleanly.
name = "rezident"
version = "0.1.2"
description = "Rezident — self-hosted operations console for coding agents"
license = { text = "Elastic-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "claude-agent-sdk>=0.1.80",
    "aiosqlite>=0.20",
    "croniter>=3.0",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentos*"]
