<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="steel" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#5d6d79"/>
      <stop offset="50%" stop-color="#3b4a58"/>
      <stop offset="100%" stop-color="#1c242c"/>
    </radialGradient>
    <radialGradient id="hub" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f2cd52"/>
      <stop offset="60%" stop-color="#d9a81e"/>
      <stop offset="100%" stop-color="#b98a1e"/>
    </radialGradient>
  </defs>
  <!-- gear teeth -->
  <g>
    <g fill="#485866">
      <rect x="28" y="0" width="8" height="10" rx="1.5"/>
      <rect x="28" y="54" width="8" height="10" rx="1.5"/>
      <rect x="0" y="28" width="10" height="8" rx="1.5"/>
      <rect x="54" y="28" width="10" height="8" rx="1.5"/>
      <g transform="rotate(45 32 32)">
        <rect x="28" y="0" width="8" height="10" rx="1.5"/>
        <rect x="28" y="54" width="8" height="10" rx="1.5"/>
        <rect x="0" y="28" width="10" height="8" rx="1.5"/>
        <rect x="54" y="28" width="10" height="8" rx="1.5"/>
      </g>
      <g transform="rotate(22.5 32 32)">
        <rect x="28" y="0" width="8" height="10" rx="1.5"/>
        <rect x="28" y="54" width="8" height="10" rx="1.5"/>
        <rect x="0" y="28" width="10" height="8" rx="1.5"/>
        <rect x="54" y="28" width="10" height="8" rx="1.5"/>
      </g>
      <g transform="rotate(67.5 32 32)">
        <rect x="28" y="0" width="8" height="10" rx="1.5"/>
        <rect x="28" y="54" width="8" height="10" rx="1.5"/>
        <rect x="0" y="28" width="10" height="8" rx="1.5"/>
        <rect x="54" y="28" width="10" height="8" rx="1.5"/>
      </g>
    </g>
  </g>
  <!-- disc -->
  <circle cx="32" cy="32" r="27" fill="url(#steel)" stroke="#10151a" stroke-width="1.5"/>
  <!-- spokes -->
  <g stroke="#55646f" stroke-width="4.5" stroke-linecap="round">
    <path d="M32 8 L32 56"/>
    <path d="M8 32 L56 32"/>
    <path d="M15 15 L49 49"/>
    <path d="M49 15 L15 49"/>
  </g>
  <!-- hub -->
  <circle cx="32" cy="32" r="13" fill="url(#hub)" stroke="#10151a" stroke-width="1.5"/>
  <text x="32" y="37" text-anchor="middle" font-family="Chakra Petch, Trebuchet MS, sans-serif" font-weight="700" font-size="13" fill="#232a20">76</text>
</svg>
